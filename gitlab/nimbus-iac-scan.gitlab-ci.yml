# Include this in a customer's own .gitlab-ci.yml:
#
#   include:
#     - remote: 'https://raw.githubusercontent.com/NimbusGuard/nimbus-iac-scanner/a0dfc5d577a2d8902800d6d741dbebfccb2064ec/gitlab/nimbus-iac-scan.gitlab-ci.yml'
#
# Pinned to a full SHA rather than /main/ (F-CICD-01). `include: remote:` fetches
# this file and GitLab runs it, so a floating ref means our default branch
# decides what executes in the customer's pipeline. This specific SHA is the
# first commit where the file it fetches is ITSELF pinned - at the previous one
# the template still installed the package from @main, so pinning the include
# there would have handed over a pinned wrapper around an unpinned payload.
#
#   nimbus-iac-scan:
#     extends: .nimbus-iac-scan
#     variables:
#       NIMBUS_IAC_SCAN_PATH: "infra/"        # optional, default "."
#       NIMBUS_MIN_SEVERITY: "HIGH"            # optional
#
# NIMBUS_API_URL/NIMBUS_API_KEY must be set as real, masked CI/CD
# variables in the customer's own GitLab project settings -- never
# committed to this file or the customer's own repo.
#
# For MR-comment posting (recommended), also set NIMBUS_GITLAB_TOKEN --
# a real GitLab Personal or Project Access Token with `api` scope,
# masked, in the customer's own project CI/CD variables. Deliberately
# NOT the predefined $CI_JOB_TOKEN -- its own real permission to post
# arbitrary MR notes isn't reliable across every project setting, so
# this tool always expects a real token supplied explicitly. Add
# `--post-mr-comment` to the script line below to enable it once the
# token is set (only takes effect on a genuine merge-request pipeline;
# a branch/tag pipeline correctly skips it, never errors).
#
# Evaluates Terraform (*.tf), CloudFormation (*.json/*.yaml/*.yml that
# structurally look like a template), and Bicep (*.bicep, via the real
# `bicep` CLI, installed below) in one combined pass.

.nimbus-iac-scan:
  stage: test
  image: python:3.12-slim
  variables:
    NIMBUS_IAC_SCAN_PATH: "."
    NIMBUS_MIN_SEVERITY: ""
  before_script:
    # Pinned to a full SHA, never @main (F-CICD-01). A customer following this
    # template installs and RUNS this package in their own pipeline with their
    # own secrets - "@main" means whatever lands on our default branch executes
    # there, audited or not, including anything an attacker pushed. A tag would
    # read better; this repo has no tags yet and cutting a release scheme is a
    # separate decision, so the SHA is what closes the security hole today.
    - pip install "git+https://github.com/NimbusGuard/nimbus-iac-scanner.git@5a6e3471581ae8935062a304deab8cabc90fcc7e"
    # Confirmed live against Microsoft's own current docs (Install Bicep
    # tools -> Install manually -> Linux) -- needed only if the project
    # being scanned has real .bicep files; harmless (a small, one-time
    # download) otherwise.
    #
    # Pinned version plus checksum, same as action.yml and for the same reason:
    # this template runs in a CUSTOMER's pipeline with the customer's secrets,
    # so an unpinned binary fetched and executed there is their exposure, not
    # ours. The finding that prompted this (F-CICD-02's P3 sibling) named
    # action.yml and test.yml but not this file, which had the identical
    # problem.
    #
    # The digest is one we computed - Azure ships no checksum file with these
    # releases - verified by downloading the artifact via both "latest/download"
    # and the explicit tag and confirming an identical sha256. See the longer
    # note in action.yml before bumping it.
    - BICEP_VERSION="v0.47.16"
    - BICEP_SHA256="64c345a58e0c3e48b1bc98a4e62d6b3adb1d238281297de3400aeafb2697aa5a"
    - curl -fLo /usr/local/bin/bicep "https://github.com/Azure/bicep/releases/download/${BICEP_VERSION}/bicep-linux-x64"
    - echo "${BICEP_SHA256}  /usr/local/bin/bicep" | sha256sum -c -
    - chmod +x /usr/local/bin/bicep
  script:
    - |
      ARGS=("--path" "$NIMBUS_IAC_SCAN_PATH")
      if [ -n "$NIMBUS_MIN_SEVERITY" ]; then
        ARGS+=("--min-severity" "$NIMBUS_MIN_SEVERITY")
      fi
      if [ -n "$NIMBUS_GITLAB_TOKEN" ]; then
        ARGS+=("--post-mr-comment")
      fi
      nimbus-iac-scan "${ARGS[@]}"
