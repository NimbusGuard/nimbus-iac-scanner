name: "NimbusGuard IaC Scan"
description: "Evaluates Terraform/CloudFormation/Bicep source against NimbusGuard's real control catalog before it's ever deployed (E2.6)."
branding:
  icon: "shield"
  color: "red"

inputs:
  api-url:
    description: "Your NimbusGuard API base URL (e.g. https://api.nimbusguard.io/v1)."
    required: true
  api-key:
    description: "A NimbusGuard service-account API key with view_findings. Pass this as a secret, never a literal value."
    required: true
  path:
    description: "Directory to scan."
    required: false
    default: "."
  min-severity:
    description: "Only fail the build on a FAIL at or above this severity (CRITICAL/HIGH/MEDIUM/LOW/INFORMATIONAL). Default: any FAIL blocks the build."
    required: false
    default: ""
  post-pr-comment:
    description: "Post/update a summary comment on the triggering pull request."
    required: false
    default: "true"
  install-bicep:
    description: "Install the 'bicep' CLI before scanning, so any .bicep files under path are actually evaluated instead of failing the build with 'CLI not found'. Set to 'false' if your own workflow already installs it, or if you have no .bicep files at all."
    required: false
    default: "true"

runs:
  using: "composite"
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install nimbus-iac-scanner
      shell: bash
      run: pip install "${{ github.action_path }}"

    # Confirmed live against Microsoft's own current docs (Install Bicep
    # tools -> Install manually -> Linux) -- the bicep CLI is NOT
    # bundled with this action, since not every caller has .bicep files
    # to scan, and this keeps the action itself small.
    - name: Install bicep CLI
      if: ${{ inputs.install-bicep == 'true' }}
      shell: bash
      # Download to $RUNNER_TEMP, NEVER a bare `bicep` in the checkout: a repo
      # that organizes its Bicep under a `bicep/` directory (very common) would
      # otherwise collide -- `curl -Lo bicep` fails with "Is a directory".
      run: |
        curl -Lo "$RUNNER_TEMP/bicep" https://github.com/Azure/bicep/releases/latest/download/bicep-linux-x64
        chmod +x "$RUNNER_TEMP/bicep"
        sudo mv "$RUNNER_TEMP/bicep" /usr/local/bin/bicep

    - name: Run scan
      shell: bash
      # EVERY input this script reads is passed through env, not only the two
      # credentials. The runner expands ${{ }} into the script TEXT before bash
      # ever parses it, so an input used that way is not a string the script
      # receives - it is part of the script. Reproduced locally while fixing
      # F-CICD-02, with `path` set to:
      #
      #   x") ; echo ... > /tmp/proof ; ARGS=("y
      #
      # which closes the quote and the array, runs an arbitrary command, and
      # reopens so the rest still parses. The injected command executed and the
      # CLI received "y" instead of the real path. Through env the same payload
      # arrives as one literal argument and nothing runs.
      #
      # The credentials above were always passed correctly, which is what makes
      # this worth a comment: the pattern was known here and applied to some
      # inputs but not the rest. A reader has to be able to tell that the env
      # block is the rule and not a special case for secrets.
      env:
        NIMBUS_API_URL: ${{ inputs.api-url }}
        NIMBUS_API_KEY: ${{ inputs.api-key }}
        GITHUB_TOKEN: ${{ github.token }}
        INPUT_PATH: ${{ inputs.path }}
        INPUT_MIN_SEVERITY: ${{ inputs.min-severity }}
        INPUT_POST_PR_COMMENT: ${{ inputs.post-pr-comment }}
      run: |
        ARGS=("--path" "$INPUT_PATH")
        if [ -n "$INPUT_MIN_SEVERITY" ]; then
          ARGS+=("--min-severity" "$INPUT_MIN_SEVERITY")
        fi
        if [ "$INPUT_POST_PR_COMMENT" = "true" ]; then
          ARGS+=("--post-pr-comment")
        fi
        nimbus-iac-scan "${ARGS[@]}"
